[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Create a function calling tool that translates natural language prompts into structured function calls"
readme = "README.md"
authors = [
    { name = "agomez-a", email = "agomez-a@student.42urduliz.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.24",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_missing_imports = true
follow_imports = "skip"

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
